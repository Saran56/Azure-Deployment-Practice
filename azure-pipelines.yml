# Docker
# Build and push an image to Azure Container Registry

trigger:
- main

resources:
- repo: self

variables:
  # Docker registry service connection
  dockerRegistryServiceConnection: '90971437-843c-4dcc-8cb2-dc089f0fb6b5'

  imageRepository: 'saranazuredeploymentpractice'

  containerRegistry: 'acrazurepractice-gpgrf4d3c9bja9eg.azurecr.io'

  dockerfilePath: '$(Build.SourcesDirectory)/backend/Dockerfile'

  tag: '$(Build.BuildId)'

  # Azure Resource Manager service connection
  azureSubscription: 'azure-service-connection'

  # Existing Container App
  containerAppName: 'ca-backend'

  resourceGroup: 'rg-azure-deployment-practice'

  vmImageName: 'ubuntu-latest'


stages:

# =========================
# BUILD + PUSH TO ACR
# =========================
- stage: Build
  displayName: 'Build and Push'
  jobs:

  - job: Build
    displayName: 'Build Docker Image'

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)


# =========================
# DEPLOY TO CONTAINER APPS
# =========================
- stage: Deploy
  displayName: 'Deploy to Container Apps'

  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: 'Deploy Backend'

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: AzureContainerApps@1
      displayName: 'Deploy Backend to Container App'
      inputs:
        azureSubscription: '$(azureSubscription)'
        containerAppName: '$(containerAppName)'
        resourceGroup: '$(resourceGroup)'
        imageToDeploy: '$(containerRegistry)/$(imageRepository):$(tag)'
        targetPort: '8080'