# Docker
# Build and push an image to Azure Container Registry
# Then deploy the image to Azure Container Apps

trigger:
- main

resources:
- repo: self

variables:
  # Docker Registry Service Connection
  dockerRegistryServiceConnection: '90971437-843c-4dcc-8cb2-dc089f0fb6b5'

  # Docker image repository name
  imageRepository: 'saranazuredeploymentpractice'

  # ACR login server
  containerRegistry: 'acrazurepractice-gpgrf4d3c9bja9eg.azurecr.io'

  # Backend Dockerfile
  dockerfilePath: '$(Build.SourcesDirectory)/backend/Dockerfile'

  # Unique image tag for every build
  tag: '$(Build.BuildId)'

  # Azure Resource Manager Service Connection
  azureSubscription: 'azure-service-connection'

  # Azure Container App
  containerAppName: 'ca-backend'

  # Azure Resource Group
  resourceGroup: 'rg-azure-deployment-practice'

  # Azure DevOps Agent
  vmImageName: 'ubuntu-latest'


stages:

# ==========================================================
# STAGE 1 - BUILD AND PUSH IMAGE TO AZURE CONTAINER REGISTRY
# ==========================================================

- stage: Build
  displayName: 'Build and Push'

  jobs:
  - job: Build
    displayName: 'Build Docker Image'

    pool:
      vmImage: $(vmImageName)

    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)


# ==========================================================
# STAGE 2 - DEPLOY IMAGE TO AZURE CONTAINER APPS
# ==========================================================

- stage: Deploy
  displayName: 'Deploy to Container Apps'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Backend to Container App'

    pool:
      vmImage: $(vmImageName)

    steps:
    - task: AzureContainerApps@1
      displayName: 'Deploy Backend to Azure Container App'
      inputs:
        azureSubscription: '$(azureSubscription)'
        containerAppName: '$(containerAppName)'
        resourceGroup: '$(resourceGroup)'
        acrName: 'acrazurepractice-gpgrf4d3c9bja9eg'
        imageToDeploy: '$(containerRegistry)/$(imageRepository):$(tag)'
        targetPort: '8080'